[package]
name = "crucible-guides"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Builds Crucible Guides, an open dataset of which anime episodes adapt their source and which are anime-only, from published fan-wiki dumps"
repository = "https://github.com/guitaripod/crucible-guides"

[[bin]]
name = "guides"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
quick-xml = "0.37"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = "2"
